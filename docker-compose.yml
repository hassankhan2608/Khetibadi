name: khetibadi

x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  DATABASE_URL: postgres://${POSTGRES_USER:-khetibadi}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-khetibadi}?sslmode=disable
  REDIS_URL: redis://redis:6379
  AUTH_SERVICE_URL: http://auth:8000
  FARM_SERVICE_URL: http://farm-service:8001
  MARKET_SERVICE_URL: http://market-service:8002
  ML_CROP_SERVICE_URL: http://ml-crop:8010
  ML_VISION_SERVICE_URL: http://ml-vision:8011
  AI_CHAT_SERVICE_URL: http://ai-chat:8012
  ML_CROP_URL: http://ml-crop:8010
  ML_VISION_URL: http://ml-vision:8011
  AI_CHAT_URL: http://ai-chat:8012
  OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
  OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
  WEATHER_CACHE_TTL: ${WEATHER_CACHE_TTL:-10800}
  GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-maps.co}
  MAPS_CO_API_KEY: ${MAPS_CO_API_KEY:-}
  DATA_GOV_IN_API_KEY: ${DATA_GOV_IN_API_KEY:-}
  MARKET_DATA_RESOURCE_ID: ${MARKET_DATA_RESOURCE_ID:-9ef84268-d588-465a-a308-a864a43d0070}
  MARKET_DATA_API_URL: ${MARKET_DATA_API_URL:-https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070}
  MARKET_DATA_FORMAT: ${MARKET_DATA_FORMAT:-json}
  MARKET_DATA_LIMIT: ${MARKET_DATA_LIMIT:-100}
  MARKET_CACHE_TTL: ${MARKET_CACHE_TTL:-21600}
  PRICE_CACHE_TTL: ${PRICE_CACHE_TTL:-21600}
  ML_ALLOW_STUB_MODE: ${ML_ALLOW_STUB_MODE:-false}
  AI_CHAT_ALLOW_FAKE_LLM: ${AI_CHAT_ALLOW_FAKE_LLM:-false}
  CHAT_STORAGE_REQUIRED: ${CHAT_STORAGE_REQUIRED:-false}
  WORKER_CONCURRENCY: "5"

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-khetibadi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-khetibadi}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-khetibadi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Go Services ─────────────────────────────────────────────────────────────
  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  farm-service:
    build:
      context: .
      dockerfile: apps/farm-service/Dockerfile
    expose:
      - "8001"
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  market-service:
    build:
      context: .
      dockerfile: apps/market-service/Dockerfile
    expose:
      - "8002"
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  workers:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    expose:
      - "8080"
    env_file: .env
    environment:
      <<: *app-env
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Python Services ─────────────────────────────────────────────────────────
  ml-crop:
    build:
      context: apps/ml-crop
      dockerfile: Dockerfile
    expose:
      - "8010"
    env_file: .env
    environment:
      <<: *app-env
    volumes:
      - ./apps/ml-crop/models:/app/models:ro

  ml-vision:
    build:
      context: apps/ml-vision
      dockerfile: Dockerfile
    expose:
      - "8011"
    env_file: .env
    environment:
      <<: *app-env
    volumes:
      - ./apps/ml-vision/models:/app/models:ro

  ai-chat:
    build:
      context: apps/ai-chat
      dockerfile: Dockerfile
    expose:
      - "8012"
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Frontend ─────────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - auth

volumes:
  postgres_data:
  redis_data:
