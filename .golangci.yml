version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofumpt
    - goimports
    - misspell
    - revive
    - gosec
    - bodyclose
    - contextcheck
    - noctx
    - nolintlint
    - errorlint
    - prealloc
    - gocritic
    - nakedret
    - exhaustive
    - godot
    - whitespace

linters-settings:
  goimports:
    local-prefixes: github.com/khetibadi
  gocritic:
    enabled-tags: [diagnostic, performance, style]
  errcheck:
    check-type-assertions: true
    check-blank: true
  nakedret:
    max-func-lines: 1
  revive:
    rules:
      - name: exported
        severity: warning
      - name: var-naming
        severity: warning
  gosec:
    excludes:
      - G401  # MD5 — not used for crypto here
      - G501  # MD5 import
  exhaustive:
    default-signifies-exhaustive: true

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - gosec
        - revive
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  go: "1.26"
