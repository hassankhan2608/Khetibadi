version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gosec
    - bodyclose
    - contextcheck
    - noctx
    - nolintlint
    - errorlint
    - prealloc
    - gocritic
    - nakedret
    - exhaustive
    - godot
    - whitespace
  settings:
    gocritic:
      enabled-tags: [diagnostic, performance, style]
    errcheck:
      check-type-assertions: true
      check-blank: true
    nakedret:
      max-func-lines: 1
    revive:
      rules:
        - name: exported
          severity: warning
        - name: var-naming
          severity: warning
    gosec:
      excludes:
        - G401
        - G501
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - gosec
          - revive

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/khetibadi

run:
  timeout: 5m
  go: "1.26"
