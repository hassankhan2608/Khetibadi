[project]
name = "khetibadi-ai-chat"
version = "0.1.0"
description = "Khetibadi AI agricultural assistant — Groq LLM + LangChain RAG + pgvector + SSE"
requires-python = ">=3.12"

dependencies = [
  # ── Web framework ────────────────────────────────────────────────────────────
  "fastapi==0.136.3",
  "uvicorn[standard]>=0.34.0",
  "python-multipart>=0.0.20",

  # ── Pydantic v2 ──────────────────────────────────────────────────────────────
  "pydantic==2.13.4",
  "pydantic-settings>=2.7.0",

  # ── LangChain ecosystem ───────────────────────────────────────────────────────
  # NOTE: LangChain 1.x (released 2025) is the current stable release.
  # "0.3.x" is no longer the latest. v1 requires Python >=3.10.
  # ConversationalRetrievalChain and LLMChain are REMOVED from langchain core;
  # use LCEL (prompt | llm | parser) or install langchain-classic for legacy chains.
  "langchain==1.3.1",
  "langchain-core==1.4.0",
  "langchain-community==0.4.2",
  "langchain-groq==1.1.2",

  # ── Vector store / database ──────────────────────────────────────────────────
  # psycopg[binary,pool]: psycopg3 with binary protocol + connection pool.
  # register_vector_async() must be called in the pool init hook.
  "pgvector==0.4.2",
  "psycopg[binary,pool]>=3.2.0",

  # ── Redis (rate limiting + async job cache) ──────────────────────────────────
  "redis[asyncio]>=5.2.0",

  # ── HTTP client (context_fetcher.py → farm-service + market-service) ─────────
  "httpx>=0.28.0",

  # ── Structured logging ───────────────────────────────────────────────────────
  "structlog==25.5.0",
  "asgi-correlation-id>=4.3.0",

  # ── Utilities ────────────────────────────────────────────────────────────────
  "numpy>=2.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.28.0",
  "respx>=0.21.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
