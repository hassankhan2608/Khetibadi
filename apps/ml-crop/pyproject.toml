[project]
name = "khetibadi-ml-crop"
version = "0.1.0"
description = "Khetibadi crop recommendation, yield prediction, and fertilizer recommendation service"
requires-python = ">=3.12"

dependencies = [
  # ── Web framework ────────────────────────────────────────────────────────────
  "fastapi==0.136.3",
  "uvicorn[standard]>=0.34.0",
  "python-multipart>=0.0.20",

  # ── Pydantic v2 ──────────────────────────────────────────────────────────────
  "pydantic==2.13.4",
  "pydantic-settings>=2.7.0",

  # ── ML inference ─────────────────────────────────────────────────────────────
  "scikit-learn==1.8.0",
  "joblib>=1.4.0",
  "numpy>=2.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.28.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
  "scikit-learn-stubs>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
